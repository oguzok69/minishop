name: Deploy mini-shop

on:
  push:
    branches: [ "master" ]     # триггер: каждый пуш в ветку master

jobs:
  deploy:
    runs-on: ubuntu-latest     # билд будет на виртуалке GitHub

    steps:
      - name: Setup Node
        uses: actions/checkout@v4
        # Скачивает код текущего коммита в CI-агент

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # Ставит нужную версию Node.js на агент

      - name: Install & Build
        run: |
          npm ci
          npm run build
        # npm ci — чистая установка зависимостей по package-lock.json
        # npm run build — CRA соберет папку build/ (работает вебпак под капотом)

      - name: Prepare target dir on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            mkdir -p /opt/mini-shop/build
            rm -rf /opt/mini-shop/build/*     # очистим старый билд, чтобы не оставалось мусора

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          source: "build/*"
          target: "/opt/mini-shop/build"
        # Копирует содержимое build/ по SCP в указанную папку на сервере

      - name: Restart Nginx container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            docker restart mini-shop || true
        # Перезапускаем контейнер, чтобы Nginx перечитал файлы (обычно даже не обязательно, но так надёжнее)
